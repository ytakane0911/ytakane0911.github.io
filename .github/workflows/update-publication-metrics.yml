name: Update publication metrics

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 1 * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Update OpenAlex metrics and merge manual JCR/WoS data
        env:
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
        run: python tools/update_publication_metrics.py --site-root .
      - name: Commit updated metrics
        run: |
          if git diff --quiet -- assets/data/publication_metrics.json; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/data/publication_metrics.json
          git commit -m "Update publication metrics"
          git push
